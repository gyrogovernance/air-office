[project]
name = "office-documents"
version = "0.1.0"
description = "AIR Office managed document extraction worker"
requires-python = ">=3.11"
dependencies = ["pypdfium2>=5"]

[project.optional-dependencies]
docling = ["docling==2.137.0", "certifi>=2026.10.19"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/office_documents"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
